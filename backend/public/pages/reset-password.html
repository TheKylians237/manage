<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Nouveau mot de passe — Mat-Manage</title><link rel="stylesheet" href="/css/secure.css"><script defer src="/js/api.js"></script><script defer src="/js/reset-password.js"></script></head><body><main class="auth-bg"><section class="auth-card"><h1>Choisir un nouveau mot de passe</h1><p class="lede">Définissez un nouveau mot de passe pour votre compte.</p><div class="auth-alert" id="error-message" role="alert"></div><div class="auth-alert" id="success-message" role="status"></div><form id="reset-form"><div class="field"><label for="password">Nouveau mot de passe</label><input id="password" name="password" type="password" minlength="12" maxlength="256" required></div><div class="field"><label for="confirmPassword">Confirmation</label><input id="confirmPassword" name="confirmPassword" type="password" minlength="12" maxlength="256" required></div><button class="btn btn-primary btn-block" type="submit">Réinitialiser</button></form></section></main></body></html>
